<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>

  <!-- Car body (simplified Israeli driving school car) -->
  <g transform="translate(50, 55)">
    <!-- Car chassis -->
    <rect x="-20" y="-5" width="40" height="12" rx="3" fill="#1f2937"/>

    <!-- Car windows -->
    <rect x="-15" y="-8" width="10" height="6" rx="1" fill="#93c5fd"/>
    <rect x="5" y="-8" width="10" height="6" rx="1" fill="#93c5fd"/>

    <!-- Car wheels -->
    <circle cx="-12" cy="8" r="3" fill="#374151"/>
    <circle cx="12" cy="8" r="3" fill="#374151"/>
  </g>

  <!-- Cup mounted on car -->
  <g transform="translate(50, 30)">
    <!-- Cup body -->
    <path d="M -5 0 L -4 8 Q -4 9 -3 9 L 3 9 Q 4 9 4 8 L 5 0" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>

    <!-- Cup handle -->
    <path d="M 5 2 Q 10 2 10 5 Q 10 8 5 8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Cup rim -->
    <ellipse cx="0" cy="0" rx="5" ry="1.5" fill="#dc2626"/>

    <!-- Cup highlight -->
    <ellipse cx="-2" cy="3" rx="1.5" ry="2" fill="#fca5a5" opacity="0.6"/>
  </g>

  <!-- Hebrew letter ל (Lamed) -->
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white" letter-spacing="2">ל</text>

  <!-- Decorative stars for excellence -->
  <g fill="#fbbf24" opacity="0.8">
    <path d="M 20 20 L 22 26 L 28 26 L 23 30 L 25 36 L 20 32 L 15 36 L 17 30 L 12 26 L 18 26 Z"/>
    <path d="M 80 20 L 82 26 L 88 26 L 83 30 L 85 36 L 80 32 L 75 36 L 77 30 L 72 26 L 78 26 Z"/>
  </g>
</svg>
